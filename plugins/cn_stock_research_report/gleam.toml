name = "pi_sparkles_cn_stock_research_report"
version = "0.1.0"
target = "javascript"
description = "Deterministic CN company research receipt compositor"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_local_import = { path = "../../finance/finance_local_import" }
finance_provenance = { path = "../../finance/finance_provenance" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "Composed caller-selected CN result receipts"
access = "bounded-local-import"
track = "cn"
