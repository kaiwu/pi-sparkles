name = "pi_sparkles_finance_calendar"
version = "0.1.0"
target = "javascript"
description = "Exact cross-track trading-calendar inspection for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_calendar = { path = "../../finance/finance_calendar" }
finance_cn_calendar = { path = "../../finance/finance_cn_calendar" }
finance_cn_identity = { path = "../../finance/finance_cn_identity" }
finance_core = { path = "../../finance/finance_core" }
finance_hk_calendar = { path = "../../finance/finance_hk_calendar" }
finance_market_calendar = { path = "../../finance/finance_market_calendar" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_track = { path = "../../finance/finance_track" }
finance_us_calendar = { path = "../../finance/finance_us_calendar" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "SSE/SZSE/BSE/HKEX/NYSE/Nasdaq"
access = "read-only local analysis of venue-published 2026 schedules"
track = "cn|hk|us"
