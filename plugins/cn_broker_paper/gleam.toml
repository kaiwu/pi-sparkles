name = "pi_sparkles_cn_broker_paper"
version = "0.1.0"
target = "javascript"
description = "Partial offline CN paper scenario and external receipt review for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_broker_review = { path = "../../finance/finance_broker_review" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "track_partial"
provider = "caller-owned CN paper evidence"
access = "offline-simulation-and-import-review-only"
track = "cn"
broker_order_mutation = false
