name = "pi_sparkles_swing_workbench"
version = "0.1.0"
target = "javascript"
description = "Network-free, receipt-driven swing workflow context for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_listing = { path = "../../finance/finance_listing" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_strategy = { path = "../../finance/finance_strategy" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
finance_journal = { path = "../../finance/finance_journal" }
finance_replay = { path = "../../finance/finance_replay" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"
