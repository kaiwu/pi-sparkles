name = "pi_sparkles_backtest"
version = "0.1.0"
target = "javascript"
description = "Bounded completed-daily scripted replay and reproduction export for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_replay = { path = "../../finance/finance_replay" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "caller-supplied canonical finance_replay definitions and events"
access = "stateless local scripted replay and bounded reproduction export"
track = "cn|hk|us"
