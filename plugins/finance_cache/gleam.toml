name = "pi_sparkles_finance_cache"
version = "0.1.0"
target = "javascript"
description = "Bounded branch-local finance cache inspection, export, and targeted expiry"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_cache_contract = { path = "../../finance/finance_cache_contract" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "local session cache ledger"
access = "user-owned branch-local state"
