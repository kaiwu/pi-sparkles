name = "pi_sparkles_sec_edgar"
version = "0.1.0"
target = "javascript"
description = "Read-only SEC EDGAR company and filing discovery for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_http = { path = "../../finance/finance_http" }
finance_sec = { path = "../../finance/finance_sec" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "SEC EDGAR"
access = "read-only"
