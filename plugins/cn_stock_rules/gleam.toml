name = "pi_sparkles_cn_stock_rules"
version = "0.1.0"
target = "javascript"
description = "Exact-listing mainland stock rule profiles for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_cn_rules = { path = "../../finance/finance_cn_rules" }
finance_core = { path = "../../finance/finance_core" }
finance_listing = { path = "../../finance/finance_listing" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "SSE/SZSE/BSE"
access = "read-only local analysis of effective-dated exchange rules"
