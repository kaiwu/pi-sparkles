name = "pi_sparkles_portfolio"
version = "0.1.0"
target = "javascript"
description = "Bounded caller-file portfolio import and inspection for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_local_import = { path = "../../finance/finance_local_import" }
finance_local_state = { path = "../../finance/finance_local_state" }
finance_portfolio_review = { path = "../../finance/finance_portfolio_review" }
finance_provenance = { path = "../../finance/finance_provenance" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
access = "caller-file-read-only"
gate = "CG-PORTFOLIO Session 21 import slice"
