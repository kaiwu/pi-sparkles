name = "pi_sparkles_broker_paper_ibkr"
version = "0.1.0"
target = "javascript"
description = "IBKR transaction-tape simulation and external paper receipt review for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_broker_review = { path = "../../finance/finance_broker_review" }
finance_execution = { path = "../../finance/finance_execution" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "explicit external IBKR tape and paper capability"
access = "named-local-simulation-and-external-receipt-review"
track = "us"
broker_order_mutation = false
