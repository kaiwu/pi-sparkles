name = "pi_sparkles_stock_event_study"
version = "0.1.0"
target = "javascript"
description = "Point-in-time event study calculations for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_local_import = { path = "../../finance/finance_local_import" }
finance_quant = { path = "../../finance/finance_quant" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "canonical replay manifests and bounded caller-owned event series"
access = "calculation-only"
track = "cn,hk,us"
