name = "pi_sparkles_broker_paper_alpaca"
version = "0.1.0"
target = "javascript"
description = "Partial offline Alpaca paper scenario and receipt review for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_broker_review = { path = "../../finance/finance_broker_review" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "track_partial"
provider = "local scenario or Alpaca caller-owned paper export"
access = "offline-simulation-and-import-review-only"
track = "us"
broker_order_mutation = false
