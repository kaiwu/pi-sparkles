name = "pi_sparkles_us_ohlcv_gaps"
version = "0.1.0"
target = "javascript"
description = "Evidence-complete US OHLCV missing-row classification for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_listing = { path = "../../finance/finance_listing" }
finance_market_alpaca = { path = "../../finance/finance_market_alpaca" }
finance_ohlcv = { path = "../../finance/finance_ohlcv" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_track = { path = "../../finance/finance_track" }
finance_us_ohlcv = { path = "../../finance/finance_us_ohlcv" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "composed receipts"
access = "local-read-only"
track = "us"
