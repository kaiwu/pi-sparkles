name = "pi_sparkles_broker_live"
version = "0.1.0"
target = "javascript"
description = "Partial non-executable handoff and external execution receipt review for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_broker_review = { path = "../../finance/finance_broker_review" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "track_partial"
provider = "caller-selected external execution channel"
access = "non-executable-handoff-and-import-review-only"
track = "cn|hk|us"
broker_order_mutation = false
