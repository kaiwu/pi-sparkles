name = "pi_sparkles_broker_live"
version = "0.1.0"
target = "javascript"
description = "Non-executable external handoff and execution receipt reconciliation for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_broker_review = { path = "../../finance/finance_broker_review" }
finance_local_import = { path = "../../finance/finance_local_import" }
finance_provenance = { path = "../../finance/finance_provenance" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "explicit caller-selected external execution capability"
access = "non-executable-handoff-and-receipt-reconciliation"
track = "cn|hk|us"
broker_order_mutation = false
