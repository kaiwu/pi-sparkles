name = "pi_sparkles_macro_fred"
version = "0.1.0"
target = "javascript"
description = "Exact bounded FRED series retrieval for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_calendar = { path = "../../finance/finance_calendar" }
finance_http = { path = "../../finance/finance_http" }
finance_math = { path = "../../finance/finance_math" }
finance_fred = { path = "../../finance/finance_fred" }
finance_provenance = { path = "../../finance/finance_provenance" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "Federal Reserve Bank of St. Louis FRED"
access = "credentialed-read-only"
