name = "pi_sparkles_cn_market_snapshot"
version = "0.1.0"
target = "javascript"
description = "Exact CN market snapshot calculations for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_calendar = { path = "../../finance/finance_calendar" }
finance_core = { path = "../../finance/finance_core" }
finance_eastmoney = { path = "../../finance/finance_eastmoney" }
finance_http = { path = "../../finance/finance_http" }
finance_local_import = { path = "../../finance/finance_local_import" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_quant = { path = "../../finance/finance_quant" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "bounded caller-owned CN market packet or explicit Eastmoney overview/CSI-sector price adapter"
access = "calculation-only import or public-web local-analysis overview; no fallback"
track = "cn"
