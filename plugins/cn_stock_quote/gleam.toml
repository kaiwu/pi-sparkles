name = "pi_sparkles_cn_stock_quote"
version = "0.1.0"
target = "javascript"
description = "Explicit-provider mainland price snapshot for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_calendar = { path = "../../finance/finance_calendar" }
finance_cache_contract = { path = "../../finance/finance_cache_contract" }
finance_core = { path = "../../finance/finance_core" }
finance_eastmoney = { path = "../../finance/finance_eastmoney" }
finance_http = { path = "../../finance/finance_http" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_track = { path = "../../finance/finance_track" }
finance_tushare = { path = "../../finance/finance_tushare" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "Eastmoney quote or Tushare Pro end-of-day daily row, explicitly selected"
access = "read-only local analysis; no automatic fallback or real-time claim"
