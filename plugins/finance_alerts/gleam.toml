name = "pi_sparkles_finance_alerts"
version = "0.1.0"
target = "javascript"
description = "Durable caller-defined finance predicates and authorized notifications for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_local_import = { path = "../../finance/finance_local_import" }
finance_local_state = { path = "../../finance/finance_local_state" }
finance_monitoring = { path = "../../finance/finance_monitoring" }
finance_notification_scripted = { path = "../../finance/finance_notification_scripted" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "caller-owned local append-only JSONL and scripted notification adapter"
access = "explicit local path atomic CAS; explicitly authorized destination reference"
track = "cn,hk,us"
