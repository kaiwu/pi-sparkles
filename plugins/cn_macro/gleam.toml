name = "pi_sparkles_cn_macro"
version = "0.1.0"
target = "javascript"
description = "Point-in-time mainland macro series information for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_local_import = { path = "../../finance/finance_local_import" }
finance_multi_asset = { path = "../../finance/finance_multi_asset" }
pi_gleam = { path = "../../pi_gleam" }

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "bounded caller-owned versioned JSON import"
access = "stateless read-only validation and calculation"
track = "cn"
