name = "pi_sparkles_finance_dataset"
version = "0.1.0"
target = "javascript"
description = "Stateless exact dataset manifest, observation, and vintage inspection for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_calendar = { path = "../../finance/finance_calendar" }
finance_core = { path = "../../finance/finance_core" }
finance_ohlcv = { path = "../../finance/finance_ohlcv" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_replay = { path = "../../finance/finance_replay" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "caller-supplied canonical dataset manifest and gap projection"
access = "read-only inspection"
track = "cn|hk|us"
