name = "pi_sparkles_stock_screener"
version = "0.1.0"
target = "javascript"
description = "Exact three-track point-in-time universe projection and caller-defined stock predicate calculations for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_calendar = { path = "../../finance/finance_calendar" }
finance_http = { path = "../../finance/finance_http" }
finance_market_alpaca = { path = "../../finance/finance_market_alpaca" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_replay = { path = "../../finance/finance_replay" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "experimental"
provider = "caller-supplied canonical manifests; Alpaca Trading Assets"
access = "credentialed-read-only"
track = "cn,hk,us projection; us acquisition"
