name = "pi_sparkles_trade_compliance"
version = "0.1.0"
target = "javascript"
description = "Partial supplied-rule trade compliance fact evaluator for Pi"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_provenance = { path = "../../finance/finance_provenance" }
finance_broker_review = { path = "../../finance/finance_broker_review" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
status = "track_partial"
provider = "caller-supplied rules and facts"
access = "pure-evaluation-only"
track = "cn|hk|us"
