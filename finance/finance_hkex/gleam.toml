name = "finance_hkex"
version = "0.1.0"
target = "javascript"
description = "Bounded byte-preserving HKEXnews public-document adapter"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_authority_pdf = { path = "../finance_authority_pdf" }
finance_authority_snapshot = { path = "../finance_authority_snapshot" }
finance_core = { path = "../finance_core" }
finance_http = { path = "../finance_http" }
finance_pdf = { path = "../finance_pdf" }
finance_track = { path = "../finance_track" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
provider = "HKEXnews"
