name = "finance_broker_review"
version = "0.1.0"
target = "javascript"
description = "Bounded non-executing broker activity and handoff review contracts"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_provenance = { path = "../finance_provenance" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
access = "caller-owned-import-and-non-executable-handoff-only"
