name = "finance_market_accounting"
version = "0.1.0"
target = "javascript"
description = "Lossless reported accounting facts and ambiguity-preserving mappings"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../finance_core" }
finance_listing = { path = "../finance_listing" }
finance_market_documents = { path = "../finance_market_documents" }
finance_provenance = { path = "../finance_provenance" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
finance_track = { path = "../finance_track" }

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
