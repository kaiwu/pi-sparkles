name = "finance_market_alpaca"
version = "0.1.0"
target = "javascript"
description = "Typed bounded Alpaca US market-data adapter"
licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../finance_core" }
finance_calendar = { path = "../finance_calendar" }
finance_http = { path = "../finance_http" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
provider = "Alpaca Market Data"
