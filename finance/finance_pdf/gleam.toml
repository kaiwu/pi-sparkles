name = "finance_pdf"
version = "0.1.0"
target = "javascript"
description = "Bounded cancellable PDF structure and page-count inspection"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
finance_core = { path = "../finance_core" }
finance_http = { path = "../finance_http" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
parser = "pdfjs-dist@6.2.108"
