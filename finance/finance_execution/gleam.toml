name = "finance_execution"
version = "0.1.0"
target = "javascript"
description = "Pure provider-neutral execution information, simulations, and receipts"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../finance_core" }
finance_math = { path = "../finance_math" }
finance_provenance = { path = "../finance_provenance" }
finance_track = { path = "../finance_track" }
finance_tape = { path = "../finance_tape" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
scope = "provider-neutral"
