name = "finance_portfolio_review"
version = "0.1.0"
target = "javascript"
description = "Pure receipt-bound portfolio review calculations"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_calendar = { path = "../finance_calendar" }
finance_core = { path = "../finance_core" }
finance_math = { path = "../finance_math" }
finance_provenance = { path = "../finance_provenance" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
scope = "provider-neutral mixed-track portfolio review"
